<div class="container1">
  <div class="box">

    <div class="tabs">
      <button [class.active]="isLoginMode" (click)="switchMode()">Login</button>
      <button [class.active]="!isLoginMode" (click)="switchMode()">Register</button>
    </div>

    <!-- Login -->
    <div *ngIf="isLoginMode" class="form">
      <h2>Welcome Back</h2>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="loginDto.email" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="loginDto.password" placeholder="Enter your password">
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="submit" (click)="onLogin()">Login</button>

      <p class="switch">Don't have an account? 
        <span (click)="switchMode()">Register</span>
      </p>
    </div>

    <!-- Register -->
    <div *ngIf="!isLoginMode" class="form">
      <h2>Create Account</h2>

      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="registerDto.username" placeholder="Enter your username">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="registerDto.email" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="registerDto.password" placeholder="Enter your password">
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="submit" (click)="onRegister()">Register</button>

      <p class="switch">Already have an account? 
        <span (click)="switchMode()">Login</span>
      </p>
    </div>

  </div>
</div>
