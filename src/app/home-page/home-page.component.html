<div class="main">
    <div class="inside">
        <div class="up">
            <h2>Latest</h2>
            <div>
                <i class="fa-solid fa-arrow-left" (click)="scrollRelated('left', $event)"></i>
                <i class="fa-solid fa-arrow-right" (click)="scrollRelated('right', $event)"></i> 
            </div>
        </div>
        <div class="middle">
            <div class="cardBox" *ngFor="let item of latest">
                <a [routerLink]="['/', item.category, item.id]">
                    <div class="card">
                        <img [src]="item.cardImageUrl" [alt]="item.title">
                        <div class="GEO"><span>GEO</span></div> 
                        <div class="ENG"><span>ENG</span></div>
                        <div class="hover"></div>
                        <div class="button"></div>
                        <i class="fa-solid fa-play"></i>
                    </div>
                </a>
                <div class="title">
                    <p>{{ item.title }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
