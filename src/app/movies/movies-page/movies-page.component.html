<div class="box">
  <a *ngFor="let movie of moviesOnPage"
     [routerLink]="['/movies', movie.id]">
    <div class="card">
      <img [src]="movie.cardImageUrl" [alt]="movie.title">
      <div class="GEO"><span>GEO</span></div>
      <div class="ENG"><span>ENG</span></div>
      <div class="hover"></div>
      <div class="button"></div>
      <i class="fa-solid fa-play"></i>
    </div>
    <div class="title"><p>{{ movie.title }}</p></div>
  </a>
</div>

<div class="Box">
  <div class="NavBox">
    <a *ngFor="let page of [].constructor(totalPages); let i = index"
       [routerLink]="'/movies/page/' + (i + 1)"
       routerLinkActive="active">
      <div class="Pages">
        <span>{{ i + 1 }}</span>
      </div>
    </a>
  </div>
</div>
